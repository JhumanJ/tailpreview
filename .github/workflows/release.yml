name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          ./scripts/render-homebrew-formula.sh "$GITHUB_REF_NAME" dist/checksums.txt /tmp/tailpreview.rb
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/JhumanJ/homebrew-tap.git" /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Formula
          cp /tmp/tailpreview.rb /tmp/homebrew-tap/Formula/tailpreview.rb
          rm -f /tmp/homebrew-tap/Casks/tailpreview.rb
          cd /tmp/homebrew-tap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "tailpreview ${GITHUB_REF_NAME}"
            git push origin main
          fi
